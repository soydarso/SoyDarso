<!-- Fondo animado -->
<div class="bg" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="blob b4"></span>
  <span class="blob b5"></span>
</div>
<div class="grain" aria-hidden="true"></div>

<div class="app">
  <header class="top">
    <a class="logo" href="#" id="logo" aria-label="Soy Darso, inicio">Soy Darso</a>

    <!-- Reproductor de música -->
    <div class="player" id="player" hidden>
      <button type="button" class="vinyl-btn" id="mToggleDisc" tabindex="-1" aria-hidden="true">
        <span class="vinyl">
          <svg class="vinyl-disc" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="19.5" fill="#070B1C"/>
            <circle cx="20" cy="20" r="17" fill="none" stroke="rgba(255,255,255,.10)" stroke-width=".6"/>
            <circle cx="20" cy="20" r="14.5" fill="none" stroke="rgba(255,255,255,.08)" stroke-width=".6"/>
            <circle cx="20" cy="20" r="12" fill="none" stroke="rgba(255,255,255,.10)" stroke-width=".6"/>
            <circle cx="20" cy="20" r="9.6" fill="none" stroke="rgba(255,255,255,.07)" stroke-width=".6"/>
            <circle cx="20" cy="20" r="7" fill="#F39A3D"/>
            <path d="M20 13a7 7 0 0 1 7 7h-3.2A3.8 3.8 0 0 0 20 16.2z" fill="#45D2FF"/>
            <circle cx="20" cy="20" r="1.3" fill="#070B1C"/>
          </svg>
          <svg class="vinyl-sheen" viewBox="0 0 40 40" aria-hidden="true">
            <path d="M8 9.5A16 16 0 0 1 20 4" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M32 30.5A16 16 0 0 1 24 35" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </span>
      </button>
      <span class="player-txt">
        <span class="player-say" id="mSay"></span>
        <span class="player-track" id="mTrack"></span>
      </span>
      <button type="button" class="p-btn" id="mToggle" aria-label="Reproducir música" aria-pressed="false">
        <svg class="i-play" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z" fill="currentColor"/></svg>
      </button>
      <button type="button" class="p-btn" id="mNext" aria-label="Siguiente canción">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 5.5v13l9-6.5zM16 5.5h2.6v13H16z" fill="currentColor"/></svg>
      </button>
    </div>

    <nav aria-label="Principal">
      <button type="button" class="nav-link" data-open-profile>Sobre mí</button>
      <button type="button" class="nav-link" data-go-projects>Proyectos</button>
      <button type="button" class="nav-link" data-open-contact>Contacto</button>
    </nav>
  </header>

  <main class="scene" id="scene" aria-label="Carrusel de proyectos">
    <h1 class="hl" id="hl"></h1>
    <div class="stage" id="stage">
      <div class="ring" id="ring"></div>
    </div>
  </main>

  <footer class="bottom">
    <div class="cap" id="cap" aria-live="polite">
      <p class="cap-title" id="capTitle"></p>
      <p class="cap-cat" id="capCat"></p>
    </div>
    <div class="hint">Desplaza o arrastra para girar. Toca un proyecto para abrirlo</div>
    <div class="count"><b id="cur">01</b> / <span id="tot">01</span></div>
  </footer>
</div>

<!-- Pop-up de proyecto -->
<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close-modal></div>
  <article class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button type="button" class="icon-btn modal-close" data-close-modal aria-label="Cerrar proyecto">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="modal-info">
      <p class="m-kicker"><span id="mCat"></span><span id="mYear"></span></p>
      <h2 class="m-title" id="mTitle"></h2>
      <p class="m-client" id="mClient"></p>
      <p class="m-msg" id="mMsg"></p>
      <dl class="m-role"><dt>Mi rol</dt><dd id="mRole"></dd></dl>
      <ul class="m-tags" id="mTags"></ul>
      <a class="m-link" id="mLink" target="_blank" rel="noopener"><span id="mLinkTxt"></span><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8 16L16 8M9.5 8H16v6.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </div>
    <div class="mini">
      <div class="mini-view" id="miniView" aria-roledescription="carrusel" aria-label="Imágenes del proyecto">
        <div class="mini-track" id="miniTrack"></div>
      </div>
      <div class="mini-ui">
        <button type="button" class="icon-btn" id="miniPrev" aria-label="Imagen anterior">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="mini-dots" id="miniDots"></div>
        <span class="mini-count" id="miniCount"></span>
        <button type="button" class="icon-btn" id="miniNext" aria-label="Imagen siguiente">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </article>
</div>

<!-- Perfil / Sobre mí -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="pfName">
    <button type="button" class="icon-btn sheet-close" data-close-sheet aria-label="Cerrar perfil">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="sheet-inner" id="sheetInner"></div>
  </div>
</div>

<div class="cursor" id="cursor" aria-hidden="true">arrastra</div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
